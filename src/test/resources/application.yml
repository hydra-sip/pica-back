spring:
  application:
    name: plataforma-pica
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    web:
      pageable:
        serialization-mode: via_dto
        max-page-size: 100

app:
  partidos:
    # Sin tareas programadas: los tests llaman a ConfirmacionAutomatica, AusenciaAutomatica, CierreAutomatico y
    # CierreAutomaticoRifa a mano.
    confirmacion-automatica: false
    ausencia-automatica: false
  torneos:
    cierre-automatico: false
  rifas:
    cierre-automatico: false
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  admin:
    username: admin
    email: admin@pica.local
    # Sin initial-password: AdminInicial no crea el Admin y cada test arma sus usuarios. El que lo
    # prueba (AdminInicialIntegracionTest) la pasa por properties.
