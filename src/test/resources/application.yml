spring:
  application:
    name: plataforma-pica
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    web:
      pageable:
        serialization-mode: via_dto
        max-page-size: 100

app:
  partidos:
    # Sin tareas programadas: los tests llaman a ConfirmacionAutomatica, AusenciaAutomatica, CierreAutomatico y
    # CierreAutomaticoRifa a mano.
    confirmacion-automatica: false
    ausencia-automatica: false
  torneos:
    cierre-automatico: false
  # Los tests que no prueban el cobro pagan sin cargar saldo; los del cobro con saldo (HU-603) lo cambian a saldo.
  cobro:
    modo: simulado
  liquidacion:
    automatica: false
  fraude:
    deteccion-automatica: false
  rifas:
    cierre-automatico: false
    sorteo-automatico: false
  # Retiros a la wallet (HU-610): un contrato ficticio y la segunda clave de prueba de anvil, que es pública. Con
  # esos datos la firma coincide con el permiso de referencia de pica-contracts (FirmanteDeRetirosTest).
  cripto:
    retiros:
      contrato: "0x00000000000000000000000000000000000ca5a5"
      clave-firmante: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      devolucion-automatica: false
  # Los avisos a Discord (PICA-369) salen en el hilo del test, para ver lo que llegó sin esperar
  discord:
    sincronico: true
    espera-base: 0s
    aviso-checkin: false   # los tests llaman a AvisoCheckinDiscord a mano
  # Las notificaciones (HU-808) también, para ver la fila, el correo y el mensaje sin esperar
  notificaciones:
    sincronico: true
    aviso-checkin: false   # los tests llaman a AvisoCheckinAbierto a mano
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  admin:
    username: admin
    email: admin@pica.local
    # Sin initial-password: AdminInicial no crea el Admin y cada test arma sus usuarios. El que lo
    # prueba (AdminInicialIntegracionTest) la pasa por properties.
