spring:
  application:
    name: plataforma-pica
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    web:
      pageable:
        serialization-mode: via_dto
        max-page-size: 100

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  admin:
    username: admin
    email: admin@pica.local
    initial-password: test-initial-password
