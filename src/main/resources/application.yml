spring:
  application:
    name: plataforma-pica

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tournament_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # El PDF del reglamento (PICA-200) y la evidencia de los partidos (PICA-241): el tope de cada archivo lo controla
  # su servicio; este es el del más grande, un video de evidencia
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      lifecycle-management: start-only

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Forma de página del contrato ({content, page: {size, number, totalElements, totalPages}}) y tope de size
  data:
    web:
      pageable:
        serialization-mode: via_dto
        max-page-size: 100

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email

# En staging el HTTPS lo atiende Caddy: sin esto, Spring arma las URLs (la vuelta de Google) con http://
server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  # El mail es opcional (sin MAIL_HOST el link va al log): que no deje la API en DOWN
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.hydra.pica: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

app:
  web-url: ${APP_WEB_URL:http://localhost:5173}
  auth:
    verification-base-url: ${APP_AUTH_VERIFICATION_BASE_URL:http://localhost:8080/api/v1/auth/verificar}
    # Sesión (CE2-8). Formato de duración de Spring: 15m, 24h, 7d.
    access-ttl: ${APP_AUTH_ACCESS_TTL:15m}        # vida del access token
    refresh-ttl: ${APP_AUTH_REFRESH_TTL:24h}      # inactividad: el refresh rota en cada uso
    sesion-maxima: ${APP_AUTH_SESION_MAXIMA:7d}   # tope desde el login, aunque se use
    intentos-login:   # RNF-SEG-06: con este máximo de fallidos en la ventana, 429 hasta que se libere
      maximo: ${APP_AUTH_INTENTOS_LOGIN_MAXIMO:5}
      ventana: ${APP_AUTH_INTENTOS_LOGIN_VENTANA:15m}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  torneos:
    cupo-maximo: ${APP_TORNEOS_CUPO_MAXIMO:64}   # tope de participantes por torneo (HU-201)
    cierre-automatico: ${APP_TORNEOS_CIERRE_AUTOMATICO:true}   # cerrar las inscripciones vencidas (HU-206)
    revision-cierres: ${APP_TORNEOS_REVISION_CIERRES:60s}   # cada cuánto se buscan
  partidos:
    plazo-objecion: ${APP_PARTIDOS_PLAZO_OBJECION:15m}   # para aceptar u objetar un resultado cargado (HU-301)
    tolerancia-checkin: ${APP_PARTIDOS_TOLERANCIA_CHECKIN:2m}   # margen en cada extremo de la ventana de check-in (HU-308)
    confirmacion-automatica: ${APP_PARTIDOS_CONFIRMACION_AUTOMATICA:true}   # confirmar los que vencieron (PICA-242)
    ausencia-automatica: ${APP_PARTIDOS_AUSENCIA_AUTOMATICA:true}   # declarar las ausencias al vencer el check-in (HU-309)
    revision-plazos: ${APP_PARTIDOS_REVISION_PLAZOS:30s}   # cada cuánto se buscan
  rifas:
    duracion-reserva: ${APP_RIFAS_DURACION_RESERVA:10m}   # lo que dura un número reservado mientras se paga (HU-403)
    cierre-automatico: ${APP_RIFAS_CIERRE_AUTOMATICO:true}   # cerrar las ventas vencidas y sellar la lista (HU-407)
    revision-cierres: ${APP_RIFAS_REVISION_CIERRES:60s}   # cada cuánto se buscan
  # Los archivos que se suben (PICA-200): local, en una carpeta, o supabase, en un bucket privado de Storage
  almacenamiento:
    tipo: ${APP_ALMACENAMIENTO_TIPO:local}
    local:
      directorio: ${APP_ALMACENAMIENTO_DIRECTORIO:}   # sin valor, pica-archivos en la carpeta temporal
    supabase:
      url: ${APP_ALMACENAMIENTO_SUPABASE_URL:}        # https://<proyecto>.supabase.co
      clave: ${APP_ALMACENAMIENTO_SUPABASE_CLAVE:}    # service_role: no sale del back
      bucket: ${APP_ALMACENAMIENTO_SUPABASE_BUCKET:reglamentos}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@pica.local}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
