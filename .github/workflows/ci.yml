# Corre la suite completa (unitarios + Testcontainers) en cada PR y en cada push a dev/main.
# Docker ya viene en ubuntu-latest, así que Postgres levanta solo; no hace falta un service.
# Al mergear a dev, además publica la imagen en GHCR, actualiza staging (infra/README.md) y corre
# la prueba de humo del contrato contra staging.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr tests
        run: ./mvnw -B --no-transfer-progress verify
        env:
          SPRING_PROFILES_ACTIVE: dev

      - name: Guardar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # En los PR solo comprueba que el Dockerfile construye; en dev la publica
  imagen:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t "$IMAGEN:dev" -t "$IMAGEN:${{ github.sha }}" .

      - name: Publicar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGEN"

  # Se saltea hasta que exista la variable STAGING_HOST
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.STAGING_HOST != ''
    needs: imagen
    runs-on: ubuntu-latest
    concurrency: staging
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    env:
      DESTINO: ${{ vars.STAGING_SSH_USER }}@${{ vars.STAGING_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Clave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Actualizar staging
        run: |
          scp infra/docker-compose.yml infra/Caddyfile "$DESTINO:/opt/pica/"
          ssh "$DESTINO" 'cd /opt/pica && docker compose pull api && docker compose up -d --remove-orphans && docker image prune -f'

      - name: Esperar a que levante
        run: curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "https://${{ vars.STAGING_HOST }}/actuator/health"

  # Recorre todas las operaciones del contrato contra staging y borra lo que creó (scripts/prueba-de-humo.sh)
  contrato:
    needs: deploy
    runs-on: ubuntu-latest
    concurrency: staging
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Clave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Prueba de humo del contrato
        run: scripts/prueba-de-humo.sh
        env:
          PICA_URL: https://${{ vars.STAGING_HOST }}
          PICA_SSH: ${{ vars.STAGING_SSH_USER }}@${{ vars.STAGING_HOST }}
