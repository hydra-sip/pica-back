# Corre la suite completa (unitarios + Testcontainers) en cada PR y en cada push a dev/main.
# Docker ya viene en ubuntu-latest, así que Postgres levanta solo; no hace falta un service.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr tests
        run: ./mvnw -B --no-transfer-progress verify
        env:
          SPRING_PROFILES_ACTIVE: dev

      - name: Guardar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
