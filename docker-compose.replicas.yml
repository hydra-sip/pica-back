# Demostración CE2-9: Escalado horizontal con dos réplicas del backend detrás de Nginx en Round Robin puro (sin session affinity).
#
# Uso (ver README, "Escalado horizontal"):
#   docker compose -f docker-compose.replicas.yml up --build -d
#   ./scripts/probar-replicas.sh
#
# Las réplicas corren sin el perfil dev, como en staging: sin JWT_PRIVATE_KEY y JWT_PUBLIC_KEY en
# .env.replicas no arrancan, en lugar de firmar cada una con su propia clave efímera.
x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  # Las variables salen solo de acá: lo que se repita en environment le ganaría al archivo
  env_file:
    - path: .env.replicas
      required: true
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tournament_db
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tournament_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_replicas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tournament_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api1: *api
  api2: *api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api1
      - api2
    ports:
      - "${REPLICAS_PORT:-8080}:80"
    volumes:
      - ./infra/nginx-round-robin.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data_replicas:
