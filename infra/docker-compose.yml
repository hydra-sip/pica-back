# Staging en la instancia EC2: Postgres, la API, la web y Caddy adelante con HTTPS.
# Los secretos van en /opt/pica/.env (ver .env.example). El CI copia este archivo y el Caddyfile.
name: pica

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pica}
      POSTGRES_USER: ${POSTGRES_USER:-pica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    <<: *logs

  api:
    image: ${API_IMAGE:-ghcr.io/hydra-sip/pica-back:dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pica}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pica}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?falta JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?falta JWT_PUBLIC_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?falta GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?falta GOOGLE_CLIENT_SECRET}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?falta ADMIN_INITIAL_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # La web y la API salen del mismo dominio
      APP_WEB_URL: https://${DOMINIO}
      APP_CORS_ALLOWED_ORIGINS: https://${DOMINIO}
      APP_AUTH_VERIFICATION_BASE_URL: https://${DOMINIO}/api/v1/auth/verificar
      # Sesión (CE2-8): opcionales, sin ellas valen los defaults
      APP_AUTH_ACCESS_TTL: ${APP_AUTH_ACCESS_TTL:-15m}
      APP_AUTH_REFRESH_TTL: ${APP_AUTH_REFRESH_TTL:-24h}
      APP_AUTH_SESION_MAXIMA: ${APP_AUTH_SESION_MAXIMA:-7d}
    <<: *logs

  web:
    image: ${WEB_IMAGE:-ghcr.io/hydra-sip/pica-web:dev}
    restart: unless-stopped
    <<: *logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados: si se pierden, Let's Encrypt limita cuántos se pueden volver a pedir
      - caddy_data:/data
      - caddy_config:/config
    <<: *logs

volumes:
  db_data:
  caddy_data:
  caddy_config:
